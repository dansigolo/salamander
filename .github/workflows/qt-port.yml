name: Qt port build and tests
on:
  push:
    branches: [improvement/salamander_for_linux]
    paths: ['port/**', 'tools/upstream_sync.py', 'tools/tests/test_upstream_sync.py', 'CMakeLists.txt', '.github/workflows/qt-port.yml']
  pull_request:
    paths: ['port/**', 'tools/upstream_sync.py', 'tools/tests/test_upstream_sync.py', 'CMakeLists.txt', '.github/workflows/qt-port.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-port-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools libglib2.0-bin
      - name: Configure
        run: cmake -S . -B build/qt -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/qt --parallel 2
      - name: Test upstream integration tooling
        run: python3 -m unittest discover -s tools/tests -p test_upstream_sync.py -v
      - name: Test
        run: ctest --test-dir build/qt --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-linux-test-results
          path: build/qt/results.xml
