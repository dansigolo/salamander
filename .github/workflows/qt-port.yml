name: Qt port build and tests
on:
  push:
    branches: [improvement/salamander_for_linux]
    paths: ['port/**', 'CMakeLists.txt', '.github/workflows/qt-port.yml']
  pull_request:
    paths: ['port/**', 'CMakeLists.txt', '.github/workflows/qt-port.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qt-port-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-base-dev-tools
      - name: Configure
        run: cmake -S . -B build/qt -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/qt --parallel 2
      - name: Test
        run: ctest --test-dir build/qt --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-linux-test-results
          path: build/qt/results.xml
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build/qt -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/qt --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build/qt -C Debug --output-on-failure --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qt-windows-test-results
          path: build/qt/results.xml
